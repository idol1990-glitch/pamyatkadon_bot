name: weekly-donate
on:
  schedule:
    - cron: "0 12 * * 1"  # понедельник 15:00 МСК (UTC+3)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-telegram-bot==21.6
      - name: Отправить донат
        run: python donate_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
